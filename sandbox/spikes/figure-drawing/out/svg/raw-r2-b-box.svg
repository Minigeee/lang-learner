<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" role="img" aria-label="Four pictures of a ball and a box: on the box, under the box, in the box, beside the box.">
  <defs>
    <!-- open-top box, 3/4 view: back rim, front face, side face -->
    <g id="boxBack"><path d="M0 0 L50 0 L62 -10 L12 -10 Z" fill="var(--fig-line)" stroke="var(--fig-line)" stroke-width="2" stroke-linejoin="round"/></g>
    <g id="boxFront"><path d="M0 0 L50 0 L50 40 L0 40 Z" fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M50 0 L62 -10 L62 30 L50 40 Z" fill="var(--fig-wood-dark)" stroke="var(--fig-line)" stroke-width="2" stroke-linejoin="round"/></g>
    <g id="boxLid"><path d="M0 0 L50 0 L62 -10 L12 -10 Z" fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2" stroke-linejoin="round"/></g>
  </defs>
  <g font-family="Microsoft YaHei" text-anchor="middle">
    <line x1="10" y1="111" x2="390" y2="111" stroke="var(--fig-ground)" stroke-width="2"/>
    <!-- on: ball resting on the closed lid -->
    <g transform="translate(20 70)"><use href="#boxLid"/><use href="#boxFront"/></g>
    <circle cx="51" cy="53" r="11" fill="var(--fig-accent)" stroke="var(--fig-line)" stroke-width="2"/>
    <text x="50" y="132" font-size="18" fill="var(--text-primary)">上</text>
    <text x="50" y="147" font-size="11" fill="var(--text-secondary)">on</text>
    <!-- under: box raised, ball on floor beneath -->
    <g transform="translate(120 34)"><use href="#boxLid"/><use href="#boxFront"/></g>
    <circle cx="151" cy="100" r="11" fill="var(--fig-accent)" stroke="var(--fig-line)" stroke-width="2"/>
    <text x="150" y="132" font-size="18" fill="var(--text-primary)">下</text>
    <text x="150" y="147" font-size="11" fill="var(--text-secondary)">under</text>
    <!-- in: open box, ball peeking over the front edge -->
    <g transform="translate(220 70)"><use href="#boxBack"/></g>
    <circle cx="254" cy="62" r="11" fill="var(--fig-accent)" stroke="var(--fig-line)" stroke-width="2"/>
    <g transform="translate(220 70)"><use href="#boxFront"/></g>
    <text x="250" y="132" font-size="18" fill="var(--text-primary)">里</text>
    <text x="250" y="147" font-size="11" fill="var(--text-secondary)">in</text>
    <!-- beside -->
    <g transform="translate(300 70)"><use href="#boxLid"/><use href="#boxFront"/></g>
    <circle cx="378" cy="99" r="11" fill="var(--fig-accent)" stroke="var(--fig-line)" stroke-width="2"/>
    <text x="345" y="132" font-size="18" fill="var(--text-primary)">旁边</text>
    <text x="345" y="147" font-size="11" fill="var(--text-secondary)">beside</text>
  </g>
</svg>
