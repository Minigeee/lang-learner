    <circle cx="280" cy="188" r="9" fill="var(--fig-hair)"/><circle cx="280" cy="188" r="3.5" fill="var(--fig-shade)"/>
    <circle cx="324" cy="188" r="9" fill="var(--fig-hair)"/><circle cx="324" cy="188" r="3.5" fill="var(--fig-shade)"/>
