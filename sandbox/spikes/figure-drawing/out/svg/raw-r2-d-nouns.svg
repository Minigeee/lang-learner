    <path d="M46 150 L46 128 L56 138 L64 138 L74 128 L74 150 Q74 164 60 164 Q46 164 46 150 Z" fill="var(--fig-fur)"/>
    <circle cx="54" cy="148" r="2" fill="var(--fig-line)"/><circle cx="66" cy="148" r="2" fill="var(--fig-line)"/>
