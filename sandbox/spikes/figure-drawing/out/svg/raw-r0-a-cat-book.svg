<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A cat sits on a book, and the book lies on a table. A chair stands beside the table.">
  <line x1="10" y1="180" x2="310" y2="180" stroke="var(--fig-ground)" stroke-width="2"/>
  <!-- chair -->
  <g fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2">
    <rect x="40" y="70" width="8" height="110"/>
    <rect x="40" y="125" width="50" height="8"/>
    <rect x="84" y="133" width="6" height="47"/>
  </g>
  <!-- table -->
  <g fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2">
    <rect x="130" y="110" width="160" height="10" rx="2"/>
    <rect x="140" y="120" width="8" height="60"/>
    <rect x="272" y="120" width="8" height="60"/>
  </g>
  <!-- book -->
  <rect x="180" y="98" width="60" height="12" rx="2" fill="var(--fig-accent)" stroke="var(--fig-line)" stroke-width="2"/>
  <!-- cat -->
  <g fill="var(--fig-fur)" stroke="var(--fig-line)" stroke-width="2">
    <ellipse cx="210" cy="82" rx="22" ry="16"/>
    <circle cx="228" cy="64" r="12"/>
    <path d="M220 56 L222 44 L228 53 Z M230 53 L236 44 L238 57 Z"/>
    <path d="M188 86 Q172 80 178 64" fill="none" stroke-width="4"/>
  </g>
  <circle cx="232" cy="63" r="1.5" fill="var(--fig-line)"/>
</svg>
