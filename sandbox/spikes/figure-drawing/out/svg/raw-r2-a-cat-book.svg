<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A cat sits on a book, and the book lies on a table. A chair stands beside the table.">
  <line x1="10" y1="180" x2="310" y2="180" stroke="var(--fig-ground)" stroke-width="2"/>
  <!-- chair: back, seat, legs -->
  <g fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2" stroke-linejoin="round">
    <rect x="38" y="66" width="9" height="114" rx="2"/>
    <rect x="44" y="76" width="6" height="40" fill="var(--fig-wood-dark)"/>
    <rect x="38" y="120" width="56" height="9" rx="2"/>
    <rect x="86" y="129" width="8" height="51" rx="2"/>
  </g>
  <!-- table: thick top, tapered legs -->
  <g fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2" stroke-linejoin="round">
    <rect x="128" y="110" width="164" height="12" rx="3"/>
    <path d="M142 122 L152 122 L150 180 L144 180 Z" fill="var(--fig-wood-dark)"/>
    <path d="M268 122 L278 122 L276 180 L270 180 Z" fill="var(--fig-wood-dark)"/>
  </g>
  <!-- book: cover + page block -->
  <g stroke="var(--fig-line)" stroke-width="2" stroke-linejoin="round">
    <rect x="176" y="94" width="68" height="16" rx="2" fill="var(--fig-accent)"/>
    <rect x="182" y="98" width="62" height="8" fill="var(--fig-fill)"/>
    <line x1="186" y1="102" x2="240" y2="102" stroke="var(--fig-shade)" stroke-width="1"/>
  </g>
  <!-- cat: loaf body, head, ears, tail curling forward -->
  <g fill="var(--fig-fur)" stroke="var(--fig-line)" stroke-width="2" stroke-linejoin="round">
    <path d="M188 94 Q182 66 210 64 Q236 64 236 94 Z"/>
    <path d="M190 92 Q170 92 172 76 Q174 70 180 72" fill="none" stroke="var(--fig-line)" stroke-width="7" stroke-linecap="round"/>
    <path d="M190 92 Q170 92 172 76 Q174 70 180 72" fill="none" stroke="var(--fig-fur)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M217 56 L219 38 L229 48 L237 38 L240 56 Q244 72 228 74 Q212 72 217 56 Z"/>
  </g>
  <g fill="var(--fig-line)">
    <circle cx="223" cy="58" r="2"/><circle cx="234" cy="58" r="2"/>
    <path d="M227 63 L230 63 L228.5 65 Z"/>
  </g>
  <path d="M200 76 L206 80 M200 84 L206 86" stroke="var(--fig-fur-dark)" stroke-width="2" stroke-linecap="round"/>
</svg>
