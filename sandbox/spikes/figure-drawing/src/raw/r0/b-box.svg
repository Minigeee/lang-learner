<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" role="img" aria-label="{{t:fig.box.aria}}">
  <g font-family="Microsoft YaHei" text-anchor="middle">
    <!-- on -->
    <rect x="25" y="60" width="50" height="40" fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2"/>
    <circle cx="50" cy="48" r="12" fill="var(--fig-accent)" stroke="var(--fig-line)" stroke-width="2"/>
    <text x="50" y="122" font-size="16" fill="var(--text-primary)">上</text>
    <text x="50" y="136" font-size="10" fill="var(--text-secondary)">{{t:gloss.on}}</text>
    <!-- under -->
    <rect x="125" y="30" width="50" height="40" fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2"/>
    <circle cx="150" cy="88" r="12" fill="var(--fig-accent)" stroke="var(--fig-line)" stroke-width="2"/>
    <text x="150" y="122" font-size="16" fill="var(--text-primary)">下</text>
    <text x="150" y="136" font-size="10" fill="var(--text-secondary)">{{t:gloss.under}}</text>
    <!-- in -->
    <rect x="225" y="60" width="50" height="40" fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2"/>
    <circle cx="250" cy="80" r="12" fill="var(--fig-accent)" stroke="var(--fig-line)" stroke-width="2"/>
    <text x="250" y="122" font-size="16" fill="var(--text-primary)">里</text>
    <text x="250" y="136" font-size="10" fill="var(--text-secondary)">{{t:gloss.in}}</text>
    <!-- beside -->
    <rect x="315" y="60" width="50" height="40" fill="var(--fig-wood)" stroke="var(--fig-line)" stroke-width="2"/>
    <circle cx="380" cy="88" r="12" fill="var(--fig-accent)" stroke="var(--fig-line)" stroke-width="2"/>
    <text x="350" y="122" font-size="16" fill="var(--text-primary)">旁边</text>
    <text x="350" y="136" font-size="10" fill="var(--text-secondary)">{{t:gloss.beside}}</text>
  </g>
</svg>
